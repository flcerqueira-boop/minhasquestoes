  {materia:"Cinesiologia e Biomecânica",tema:"Joelho",tipo:"Dissertativa",dificuldade:"Difícil",
   enunciado:"Os ligamentos cruzados anterior (LCA) e posterior (LCP) do joelho desempenham papel fundamental na estabilidade articular, sendo tensionados de forma diferente conforme as posições do joelho. Essa diferença de tensionamento é causada pela artrocinemática entre tíbia e fêmur.\n\nExplique, com base na artrocinemática do joelho, quais posições e movimentos aumentam o tensionamento do LCA e do LCP. Em sua resposta, aborde:\n• Qual movimento tensiona o LCA e qual movimento tensiona o LCP.\n• Qual a influência da artrocinemática no tensionamento do LCA e do LCP.",
   gabarito:"O LCA é tensionado durante a translação anterior da tíbia sobre o fêmur (ou posterior do fêmur sobre a tíbia), o que ocorre principalmente na extensão do joelho e em posições de menor flexão. O LCP é tensionado na translação posterior da tíbia, ocorrendo principalmente na flexão do joelho. Artrocinemática: no movimento de flexão do joelho, a tíbia realiza rolamento posterior com deslizamento anterior (mecanismo de Roll-gliding), o que traciona o LCP. Na extensão, ocorre rolamento anterior com deslizamento posterior, tensionando o LCA. O parafuso terminal (rotação tibial externa nos graus finais de extensão) aumenta ainda mais a tensão do LCA."},

  {materia:"Cinesiologia e Biomecânica",tema:"Cotovelo",tipo:"Dissertativa",dificuldade:"Difícil",
   enunciado:"A epicondilite lateral é uma inflamação do tendão proximal dos extensores do punho. Estes músculos são lesionados em atividades esportivas e laborais que exigem contração mantida.\n\nApesar de associado a extensão do punho, a epicondilite costuma gerar dor durante a preensão palmar. Explique biomecanicamente qual a relação existe entre os músculos extensores do punho e o movimento de preensão palmar.",
   gabarito:"Durante a preensão palmar, os flexores dos dedos (FSD e FPD) geram uma tendência à flexão do punho. Para manter o punho em posição neutra ou em extensão — posição de maior eficiência dos flexores dos dedos — os extensores do punho (ECRL, ECRB e ECU) precisam se contrair isometricamente. Essa co-contração sustentada dos extensores, especialmente o ECRB que origina no epicôndilo lateral, explica a dor durante a preensão: o tendão já inflamado é submetido a tensão adicional mesmo sem realizar extensão ativa do punho."}

  {materia:"Cinesiologia e Biomecânica",tema:"Coluna",tipo:"Múltipla Escolha",dificuldade:"Médio",
   enunciado:"No plano frontal a coluna vertebral deve ser completamente reta. Já no plano sagital espera-se encontrar algumas curvas fisiológicas. Variações nestas curvas não são necessariamente patologias, mas são alterações do alinhamento normal. Sobre os desalinhamentos da coluna assinale a alternativa correta:",
   alternativas:["A hipercifose lombar aumenta a flexão da coluna.","A hiperlordose é o aumento da concavidade posterior no plano sagital.","A retificação é um desalinhamento exclusivo da coluna torácica.","A hipercifose aumenta a capacidade de amortecimento da coluna torácica.","A escoliose é o desalinhamento do plano sagital da coluna torácica."],correta:3},

  {materia:"Cinesiologia e Biomecânica",tema:"Joelho",tipo:"Múltipla Escolha",dificuldade:"Médio",
   enunciado:"Durante a flexão do joelho diferentes estruturas mudam seu alinhamento, alterando os pontos de compressão articular. Baseado neste relato, assinale a alternativa correta:",
   alternativas:["Durante a flexão não ocorre compressão meniscal.","Durante a flexão em cadeia cinética fechada ocorre compressão prioritária dos cornos anteriores dos meniscos.","Durante a flexão em cadeia cinética fechada ocorre deslizamento posterior do fêmur com aumento da tensão do ligamento cruzado posterior.","Durante a flexão em cadeia cinética aberta ocorre deslizamento posterior do fêmur com aumento da tensão do ligamento cruzado anterior.","Durante a flexão a patela desloca-se para frente, aumentando o espaço para o fêmur."],correta:2},

  {materia:"Cinesiologia e Biomecânica",tema:"Cotovelo",tipo:"Múltipla Escolha",dificuldade:"Médio",
   enunciado:"Um paciente de 41 anos, praticante recreacional de musculação, procura atendimento relatando dor e sensação de fraqueza ao realizar exercícios de flexão de cotovelo. Ele refere que o desconforto aumenta quando realiza o movimento com o antebraço totalmente supinado, mas diminui quando utiliza pegada neutra ou pronada. Considerando a biomecânica dos principais flexores do cotovelo e a influência da posição do antebraço, qual alternativa explica melhor os achados?",
   alternativas:["A queixa é compatível com o músculo supinador redondo.","A queixa é compatível com lesão do bíceps braquial, flexor primário do cotovelo.","A queixa é compatível com lesão do bíceps braquial. Este músculo reduz seu torque quando antebraço em neutro ou em pronação.","A queixa é compatível com lesão do braquial, flexor do cotovelo com maior torque.","A queixa é compatível com braquiorradial. Flexor do cotovelo com mais força em supinação."],correta:2},

  {materia:"Cinesiologia e Biomecânica",tema:"Quadril",tipo:"Múltipla Escolha",dificuldade:"Médio",
   enunciado:"A coxartrose é um intenso desgaste da articulação coxofemoral muito comum em idosos, relacionado ao aumento de pressão entre a cabeça do fêmur e o acetábulo. Assim, deve-se evitar movimentos que aumentem a pressão entre cabeça do fêmur e acetábulo em pacientes com essa lesão. Assinale a alternativa que indica os movimentos que devem ser evitados neste caso:",
   alternativas:["Extensão - adução - rotação externa.","Extensão - abdução - rotação interna.","Flexão - abdução - rotação externa.","Flexão - adução - rotação interna.","Flexão - abdução - rotação interna."],correta:3},

  {materia:"Cinesiologia e Biomecânica",tema:"Joelho",tipo:"Múltipla Escolha",dificuldade:"Médio",
   enunciado:"Após uma queda com trauma anterior do joelho um paciente sofre uma importante fratura da patela. Sem condições de consolidação, o médico opta pela retirada completa da patela. Assinale a alternativa que indica a fase da marcha que deve ficar comprometida após a retirada da patela.",
   alternativas:["Balanço médio.","Balanço inicial.","Resposta a carga.","Contato inicial.","Apoio médio."],correta:2},

  {materia:"Cinesiologia e Biomecânica",tema:"Ombro",tipo:"Dissertativa",dificuldade:"Difícil",
   enunciado:"Todas as articulações apresentam estabilizadores estáticos e dinâmicos. Os estabilizadores dinâmicos do ombro são principalmente os músculos do manguito rotador. Grande parte das lesões ortopédicas do ombro ocorrem por alterações e insuficiência nestes músculos. Baseado neste relato, descreva o papel do manguito rotador respondendo: A. Quais são os músculos que formam o manguito? B. Qual o papel do manguito na artrocinemática da abdução do ombro. C. Por que eles são mais importantes para a estabilidade do ombro quando comparado aos músculos estabilizadores do quadril.",
   gabarito:"A. Supraespinhal, infraespinhal, redondo menor e subescapular (SIRS). B. Durante a abdução, o manguito rotador deprime a cabeça do úmero contrabalançando a força do deltoide que tende a elevá-la contra o arco coracoacromial, mantendo o fulcro articular e possibilitando abdução completa sem impacto subacromial. C. O ombro tem pequena congruência óssea (cabeça grande em fossa pequena), dependendo muito dos estabilizadores dinâmicos. O quadril tem grande congruência óssea (encaixe profundo do acetábulo), fornecendo estabilidade passiva intrínseca."},

  {materia:"Cinesiologia e Biomecânica",tema:"Tornozelo e Pé",tipo:"Dissertativa",dificuldade:"Difícil",
   enunciado:"A entorse do tornozelo é a mais frequente lesão dessa articulação, normalmente associada a falha dos estabilizadores, ocorrendo especialmente em inversão. Baseado nisso responda: A. Por que a entorse ocorre primordialmente em inversão? B. Qual músculo você deveria fortalecer com objetivo de evitar essa lesão? Justifique.",
   gabarito:"A. A entorse ocorre em inversão porque: o maléolo lateral é mais longo e inferior, oferecendo menor restrição óssea; os ligamentos laterais (talofibular anterior) são mais finos e fracos que o deltoide medial; o centro de gravidade favorece a supinação em desequilíbrio. B. Fortalecer os fibulares (fibular longo e curto), principais estabilizadores dinâmicos contra a inversão excessiva, que geram eversão e pronação contrariando o mecanismo de entorse."}

  {materia:"Cinesiologia e Biomecânica",tema:"Biomecânica Muscular",tipo:"Múltipla Escolha",dificuldade:"Fácil",enunciado:"A cinesiologia e a biomecânica são ciências derivadas da física, que representam a base do estudo do movimento humano, fundamental para diversos profissionais da saúde, dentre eles, o Fisioterapeuta. (Neumann, 2011)\n\nConsiderando as afirmações abordadas no texto, pode-se afirmar que a Cinesiologia e a Biomecânica permitem ao fisioterapeuta:",alternativas:["Estudar as patologias com base nas alterações da estrutura biológica.", "Prescrever exercícios com base na capacidade aeróbica do paciente.", "Entender o movimento normal e prescrever exercícios para um grupo muscular específico.", "Prescrever técnicas de terapia manual de forma adequada.", "Compreender o movimento não funcional do paciente, bem como as doenças do sistema muscular."],correta:2},
  {materia:"Cinesiologia e Biomecânica",tema:"Biomecânica Muscular",tipo:"Múltipla Escolha",dificuldade:"Fácil",enunciado:"Ao colocar um objeto de 5kg sobre uma mesa, este aplica uma força na mesa, porém permanece parado sem movimento. Este fato ocorre uma vez que:",alternativas:["A mesa também aplica uma força sobre o objeto em igual intensidade e vetor contrário.", "A mesa também aplica uma força sobre o objeto com igual vetor e intensidade.", "A mesa também aplica uma força sobre o objeto em intensidade superior e vetor contrário.", "A mesa também aplica uma força sobre o objeto em intensidade inferior e vetor contrário.", "A gravidade aplica uma força no objeto com vetor contrário à sua ação."],correta:0},
  {materia:"Cinesiologia e Biomecânica",tema:"Biomecânica Muscular",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Durante uma sessão de Fisioterapia o Fisioterapeuta prescreveu um exercício de adução horizontal partindo do decúbito dorsal para fortalecimento de peitoral maior. Após a primeira repetição o paciente relata dificuldade em realizar o movimento devido ao peso. Qual alternativa o Fisioterapeuta poderia dar para facilitar a execução do exercício?",alternativas:["Aumentar a extensão do cotovelo com objetivo de aumentar o torque da potência.", "Aumentar a extensão do cotovelo com objetivo de reduzir o torque da resistência.", "Aumentar a flexão do cotovelo com objetivo de aumentar o torque da potência.", "Aumentar a flexão do cotovelo com objetivo de reduzir o torque da resistência.", "Reduzir a velocidade da execução do movimento, aumentando a força da potência."],correta:3},
  {materia:"Cinesiologia e Biomecânica",tema:"Fratura",tipo:"Múltipla Escolha",dificuldade:"Difícil",enunciado:"O Fisioterapeuta recebeu uma imagem radiográfica para analisar uma fratura. Durante a observação o profissional identificou próximo a todas as epífises uma zona sem captação óssea. Observou ainda que a fratura havia sido do tipo incompleta, com deformidade óssea na ulna e no rádio.\n\nAvalie as afirmativas:\nI - Pode-se afirmar que o paciente é uma criança.\nII - Essa fratura é denominada Fratura em Galho Verde. Sua ocorrência se dá pela alta concentração de compostos orgânicos neste osso.\nIII - As zonas sem captação óssea próxima à epífise é causada pela presença de cartilagem no local.\nIV - Para que ocorra a consolidação da fratura observada faz-se necessário a ocorrência de estímulos mecânicos nos ossos.\n\nÉ correto apenas o que se afirma em:",alternativas:["I e II", "I e III", "II e III", "I, II e IV", "I, II, III e IV"],correta:3},
  {materia:"Cinesiologia e Biomecânica",tema:"Fratura",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Os ossos longos são divididos em epífise e diáfise. As fraturas das regiões epifisárias costumam prejudicar os movimentos das articulações. Avalie as afirmativas:\n\nI - A fratura do côndilo lateral do fêmur pode prejudicar sua articulação com a epífise proximal da fíbula.\nII - A fratura da epífise distal da tíbia pode prejudicar sua articulação com o tálus no tornozelo.\nIII - O colo do fêmur é a estrutura articular proximal do fêmur que se articula com o acetábulo.\nIV - Na epífise proximal do úmero podemos localizar a cabeça do úmero que se articula com a cavidade glenoide da escápula.\nV - A fratura da cabeça da ulna prejudica os movimentos de flexão e extensão do cotovelo em sua articulação com a tróclea do úmero.\n\nÉ correto apenas o que se afirma em:",alternativas:["I e V.", "II e IV.", "I, III e IV.", "II, III, IV e V.", "I, II, III, IV, V."],correta:1},
  {materia:"Cinesiologia e Biomecânica",tema:"Biomecânica Muscular",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Para que a contração muscular ocorra, alguns eventos fisiológicos são necessários. Avalie as afirmativas:\n\nI - Para que ocorra contração necessita-se que um estímulo excitatório chegue ao músculo.\nII - Para que ocorra contração necessita-se que uma molécula de ATP seja produzida para ocorrer mudança da estrutura da miosina.\nIII - Para que ocorra contração necessita-se que o cálcio presente dentro do músculo conecte-se com a troponina/tropomiosina.\nIV - Para que ocorra contração necessita-se que a actina deslize sobre a miosina.\n\nÉ correto apenas o que se afirma em:",alternativas:["I e III.", "III e IV.", "I e II.", "I, III e IV.", "I, II, III e IV."],correta:3},
  {materia:"Cinesiologia e Biomecânica",tema:"Biomecânica Muscular",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Avalie as afirmativas sobre músculos:\n\nI - O gastrocnêmio localiza-se no compartimento posterior do tornozelo, realizando flexão plantar.\nII - O quadríceps localiza-se no compartimento anterior do joelho, realizando flexão dessa articulação.\nIII - O glúteo máximo localiza-se no compartimento posterior do quadril, realizando flexão dessa articulação.\nIV - O infraespinhoso localiza-se no compartimento posterior do ombro, realizando rotação externa dessa articulação.\nV - O tríceps braquial localiza-se no compartimento anterior do cotovelo, realizando flexão dessa articulação.\n\nÉ correto apenas o que se afirma em:",alternativas:["I, II e III.", "I, II e IV.", "I, IV e V.", "II, III e V.", "III, IV e V."],correta:1},
  {materia:"Cinesiologia e Biomecânica",tema:"Biomecânica Muscular",tipo:"Múltipla Escolha",dificuldade:"Fácil",enunciado:"A corrida é uma sequência de saltos para frente e exige força para empurrar o chão. Considerando as informações, pode-se afirmar que o mecanismo da corrida depende primordialmente da:",alternativas:["Primeira lei de Newton, uma vez que as forças entre o pé do atleta e o chão se anulam por serem opostas.", "Segunda lei de Newton, uma vez que a força gerada pelo pé do atleta tem a mesma direção do movimento por ele realizado.", "Terceira lei de Newton, uma vez que a força gerada pelo pé do atleta no chão resulta em uma força de igual intensidade e vetor oposto que o desloca para frente.", "Lei da gravidade, uma vez que seu deslocamento ao solo se dá na direção da resistência.", "Lei fundamental da dinâmica, uma vez que quanto maior o peso do atleta mais será a força de impulsão na corrida."],correta:2},
  {materia:"Cinesiologia e Biomecânica",tema:"Biomecânica Muscular",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"O levantamento de peso - prova de arremesso é executada assim: atleta ergue a barra do chão até os ombros (1), mantém o peso parado com flexão do joelho (2), ergue a barra acima da cabeça (3), estabiliza com braços e pernas estendidas (4), e deixa o peso cair livremente no solo (5).\n\nConsiderando a descrição, quais as características da contração muscular realizada?",alternativas:["Contração isométrica no momento 2 e 4. Contração concêntrica no momento 1 e 3. Sem necessidade de contração no momento 5.", "Contração isométrica no momento 2 e 4. Contração concêntrica no momento 1 e 3. Contração excêntrica no momento 5.", "Contração isométrica no momento 1 e 3. Contração concêntrica no momento 2 e 4. Sem necessidade de contração no momento 5.", "Contração isométrica no momento 1 e 2. Contração concêntrica no momento 3 e 4. Contração excêntrica no momento 5.", "Por ser uma prova de força, todos os momentos são realizados com contração concêntrica."],correta:0},
  {materia:"Cinesiologia e Biomecânica",tema:"Biomecânica Muscular",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"É comum a utilização de muletas para auxiliar a marcha após a fratura do tornozelo. Na descida de uma escada, a perna sadia fica posteriormente, responsável por controlar o movimento durante a chegada do pé ao solo através de uma flexão simultânea do quadril, do joelho e do tornozelo.\n\nQuais músculos e contrações musculares devem ocorrer na perna sadia durante a descida da escada?",alternativas:["Contração excêntrica de quadríceps e glúteo máximo e contração concêntrica de tríceps sural.", "Contração excêntrica de isquiostibiais, iliopsoas e tibial anterior.", "Contração concêntrica de isquiostibiais, iliopsoas e tibial anterior.", "Contração excêntrica de quadríceps, glúteo máximo e tríceps sural.", "Contração isométrica de quadríceps, glúteo máximo e tríceps sural."],correta:3},
  {materia:"Cinesiologia e Biomecânica",tema:"ATM",tipo:"Dissertativa",dificuldade:"Difícil",enunciado:"Paciente dá entrada no serviço de fisioterapia devido dor na cervical e nos músculos da ATM. Após exame de imagem o fisioterapeuta observou que a dor cervical é causada por um posicionamento do pescoço que favorece compressão do núcleo pulposo contra a medula espinhal.\n\nComo este posicionamento piora a dor muscular da ATM? Quais músculos são mais solicitados?"},
  {materia:"Cinesiologia e Biomecânica",tema:"ATM",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Paciente apresenta travamento mandibular devido luxação posterior do disco articular. Sobre este fato, assinale a alternativa correta:",alternativas:["Pode ser causado por fraqueza dos temporais.", "Pode ser causado por ruptura do ligamento elástico.", "Pode ser causado por fraqueza do pterigóide lateral.", "Pode ser causado por fraqueza do pterigóide medial.", "NDA"],correta:1},
  {materia:"Cinesiologia e Biomecânica",tema:"Ombro",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Paciente relata dor no ombro durante abdução ainda nos primeiros graus de movimento. Em qual articulação está a lesão do paciente?",alternativas:["Acrômioclavicular", "Glenoumeral", "Esternocostal", "Escapulotorácica", "NDA"],correta:1},
  {materia:"Cinesiologia e Biomecânica",tema:"Joelho",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Um paciente que retira completamente a patela devido uma fratura apresenta limitação em qual das fases da marcha?",alternativas:["Balanço médio", "Contato inicial", "Resposta a carga", "Apoio médio", "NDA"],correta:2},
  {materia:"Cinesiologia e Biomecânica",tema:"Cotovelo",tipo:"Dissertativa",dificuldade:"Difícil",enunciado:"Explique detalhadamente porque uma fratura na região distal do úmero pode influenciar nos movimentos do punho."},
  {materia:"Cinesiologia e Biomecânica",tema:"Biomecânica Muscular",tipo:"Dissertativa",dificuldade:"Médio",enunciado:"Para aumentar a velocidade de uma corrida, o atleta precisa necessariamente aumentar o comprimento da passada. Você concorda com essa afirmação? Justifique sua resposta."},
  {materia:"Cinesiologia e Biomecânica",tema:"Ombro",tipo:"Dissertativa",dificuldade:"Médio",enunciado:"Qual importância do serrátil anterior para a abdução do ombro?"},
  {materia:"Cinesiologia e Biomecânica",tema:"Biomecânica Muscular",tipo:"Verdadeiro/Falso",dificuldade:"Médio",enunciado:"Assinale com V quando verdadeiro e F quando falso:\n\n( ) No surf os estabilizadores dinâmicos da coluna são muito solicitados, entre eles o transverso do abdômen.\n( ) Durante o arremesso do Handebol ocorre uma fase concêntrica, seguida de uma potente fase excêntrica dos rotadores internos.\n( ) Os movimentos de agachamento do Crossfit dependem da contração concêntrica do iliopsoas na fase de descida.\n( ) Isquiostibiais e quadríceps são os músculos responsáveis pela potência do chute no futebol.\n( ) Na fase de movimentos dentro da água o peitoral maior realiza força excêntrica em nadadores durante a modalidade 'peito'.\n( ) Durante a aceleração do forehand no tênis ocorre ação do peitoral maior.\n( ) Na ginástica é fundamental a potência do salto vertical. Para melhorar essa potência é importante o fortalecimento de quadríceps e glúteo máximo.\n( ) Durante o 'direto' do MuayThai é importante a ação do serrátil anterior para aumento da potência do golpe.",gabarito:"V, F, F, V, F, V, V, V"},
  {materia:"Ortopedia",tema:"Quadril",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Qual das alterações abaixo aumenta o risco de fratura do colo femural em idosos?",alternativas:["Anteversão pélvica.", "Retroversão pélvica.", "Coxa valga.", "Coxa vara.", "NDA"],correta:3},
  {materia:"Ortopedia",tema:"Tornozelo e Pé",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Uma fratura na região distal do terceiro metatarso pode prejudicar:",alternativas:["O arco longitudinal medial e, por consequência, a impulsão.", "O arco longitudinal medial e, por consequência, a absorção de impacto.", "O arco longitudinal lateral e, por consequência, a distribuição de carga.", "O arco transverso e, por consequência, a propulsão.", "NDA"],correta:3},
  {materia:"Ortopedia",tema:"Joelho",tipo:"Verdadeiro/Falso",dificuldade:"Difícil",enunciado:"Sobre o exercício de agachamento assinale V quando verdadeiro ou F quando falso:\n\n( ) O contato ósseo entre tálus e pinça bimaleolar pode limitar a fase de descida do agachamento, devido o bloqueio da dorsoflexão.\n( ) A fase excêntrica ocorre durante a flexão do joelho, tendo como agonista os isquiostibiais.\n( ) Agachamentos com grau de flexão do joelho maior que 50° aumentam a pressão na cartilagem articular da patela.\n( ) Trata-se de exercício em cadeia cinética fechada.\n( ) As forças de cisalhamento articular são maiores que as forças de compressão.\n( ) O glúteo máximo tem mais torque, quanto mais profundo for o agachamento.\n( ) Os cornos posteriores dos meniscos são mais comprimidos durante a descida do agachamento.\n( ) Quanto mais profundo for o agachamento mais tensão ocorrerá no ligamento iliofemural (quadril) e cruzado posterior (joelho).\n( ) Durante o agachamento, a tíbia rola e desliza sobre o fêmur.\n( ) No joelho, ocorre uma alavanca do tipo interpotente.",gabarito:"V, F, V, V, F, V, V, V, V, F"},
  {materia:"Ortopedia",tema:"Coluna",tipo:"Dissertativa",dificuldade:"Difícil",enunciado:"A hérnia de disco é uma lesão na qual o núcleo pulposo se desloca para fora do disco, podendo comprimir a medula, cauda equina ou raízes nervosas.\na. Qual movimento aumenta o risco dessa lesão com compressão das estruturas citadas no enunciado? Justifique.\nb. Qual movimento da pelve aumenta o risco dessa compressão? Justifique."},
  {materia:"Ortopedia",tema:"Quadril",tipo:"Dissertativa",dificuldade:"Difícil",enunciado:"Qual a importância do transverso do abdômen para a contração efetiva do iliopsoas?"},
  {materia:"Ortopedia",tema:"Joelho",tipo:"Dissertativa",dificuldade:"Difícil",enunciado:"Os músculos do complexo póstero-lateral do quadril são importantes para todo o membro inferior, podendo inclusive evitar a luxação lateral da patela. Quais os músculos compõem este complexo e como eles influenciam o alinhamento femoropatelar evitando a referida alteração?"},
  {materia:"Ortopedia",tema:"Joelho",tipo:"Dissertativa",dificuldade:"Difícil",enunciado:"Você foi contratado para realizar fisioterapia domiciliar em um paciente. Devido a lesão apresentada você prescreveu fortalecimento de quadríceps com caneleira de 5Kg (paciente sentado na beira da cama realizando extensão/flexão com caneleira), o que torna o exercício muito difícil. Cite e explique cinesiologicamente duas maneiras de facilitar a execução do exercício descrito, mantendo a caneleira de 5Kg, sem ajudar diretamente na execução do exercício."},
  {materia:"Ortopedia",tema:"Coluna",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Sobre biomecânica do disco intervertebral, assinale a alternativa correta.",alternativas:["A flexão cervical comprime a região anterior do disco, deslocando o núcleo pulposo para posterior, aumentando o risco de compressão da medula espinhal.", "A extensão da lombar comprime a região posterior do disco, deslocando o núcleo pulposo para anterior, aumentando o risco de compressão do ligamento amarelo.", "A rotação torácica desloca o núcleo pulposo contra-lateralmente ao movimento.", "O deslocamento do disco em qualquer intensidade é patológico, sendo chamado de hérnia de disco.", "NDA"],correta:0},
  {materia:"Ortopedia",tema:"Ombro",tipo:"Dissertativa",dificuldade:"Médio",enunciado:"O trapézio superior e o trapézio inferior são, ao mesmo tempo, sinergistas e antagonistas. Justifique essa afirmação."},
  {materia:"Ortopedia",tema:"Cotovelo",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Paciente da entrada na fisioterapia com epicondilite lateral do cotovelo (inflamação dos tendões que se inserem no epicôndilo lateral do úmero). Para seu tratamento, fisioterapeuta prescreve fortalecimento isométrico dos músculos afetados. Assinale a alternativa que melhor descreve o exercício prescrito:",alternativas:["Flexo extensão do cotovelo, com halteres, com antebraço supinado.", "Flexo extensão do cotovelo, com halteres, com antebraço pronado.", "Flexo extensão do cotovelo, com halteres, com antebraço em neutro.", "Pronação com uso de elástico.", "NDA"],correta:4},
  {materia:"Ortopedia",tema:"Ombro",tipo:"Verdadeiro/Falso",dificuldade:"Médio",enunciado:"Sobre o espaço subacromial assinale V quando verdadeiro ou F quando falso:\n\n( ) Em indivíduos sem lesão o úmero sobe durante a abdução, reduzindo o espaço.\n( ) A rotação interna do úmero aproxima o tubérculo maior do acrômio.\n( ) Os movimentos escapulares não alteram o espaço subacromial.\n( ) A contração do manguito rotador reduz o espaço subacromial.\n( ) A fraqueza do trapézio inferior reduz o espaço subacromial.",gabarito:"F, V, F, F, V"},
  {materia:"Ortopedia",tema:"Ombro",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Em qual posição devemos fortalecer o infraespinhoso e o redondo menor para maior eficiência do exercício?",alternativas:["Rotação externa, partindo de abdução 90 graus.", "Rotação externa, partindo de abdução 10 graus.", "Rotação interna, partindo de abdução 90 graus.", "Abdução no plano escapular em seus primeiros graus.", "NDA"],correta:1},
  {materia:"Ortopedia",tema:"Punho e Mão",tipo:"Dissertativa",dificuldade:"Médio",enunciado:"Em um desvio ulnar forçado do punho qual estrutura tende a ser lesionada? Justifique."},
  {materia:"Ortopedia",tema:"ATM",tipo:"Dissertativa",dificuldade:"Médio",enunciado:"Apesar de não ser um músculo, os ligamentos elásticos retrodiscais da ATM atuam como um antagonista do pterigóide lateral. Justifique essa afirmativa."},
  {materia:"Cinesiologia e Biomecânica",tema:"Quadril",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"O quadril é uma articulação com grande estabilidade e reduzida mobilidade, principalmente para extensão. Analise as afirmativas abaixo e assinale a que apresenta a justificativa para redução da extensão do quadril.",alternativas:["Tensão do ligamento redondo em extensão.", "Posicionamento anterior da cabeça do fêmur e posterior do acetábulo.", "Reduzida congruência articular.", "Tensionamento do ligamento iliofemural em extensão.", "NDA"],correta:3},
  {materia:"Cinesiologia e Biomecânica",tema:"Joelho",tipo:"Dissertativa",dificuldade:"Médio",enunciado:"Cite e explique o que acontece com a patela nas diferentes condições:\nA. Valgo do joelho.\nB. Bipedestação em posição anatômica."},
  {materia:"Cinesiologia e Biomecânica",tema:"Tornozelo e Pé",tipo:"Verdadeiro/Falso",dificuldade:"Médio",enunciado:"Analise as afirmativas abaixo e assinale com A caso esteja relacionado com o antepé, M caso esteja relacionado com o mediopé e R caso esteja relacionado com o retropé:\n\n( ) Região de contato inicial.\n( ) Pé de recepção.\n( ) Pé de propulsão.\n( ) Local onde encontramos o navicular.\n( ) Local onde encontramos o arco longitudinal anterior.",gabarito:"R, R, A, M, A"},
  {materia:"Cinesiologia e Biomecânica",tema:"Joelho",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Sobre estabilização articular assinale a alternativa correta.",alternativas:["No quadril, o principal estabilizador passivo é o ligamento redondo.", "No joelho, o ligamento cruzado anterior limita a translação anterior do fêmur.", "No tornozelo, o maléolo da fíbula e o ligamento deltóide limitam a eversão.", "Na patela, o côndilo femural medial é um estabilizador mais importante que o côndilo lateral.", "NDA"],correta:2},
  {materia:"Cinesiologia e Biomecânica",tema:"Biomecânica Muscular",tipo:"Dissertativa",dificuldade:"Médio",enunciado:"Qual o papel do quadríceps e dos isquiotibiais durante a marcha? (seja específico)"},
  {materia:"Cinesiologia e Biomecânica",tema:"Biomecânica Muscular",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Sobre postura assinale a alternativa correta:",alternativas:["Para evitar dores na coluna, devemos adotar posturas corretas para sentar e deitar.", "A variação constante de postura pode aumentar o desgaste articular.", "Pacientes com alterações posturais aumentam o risco de lesões articulares.", "A mesma postura correta previne lesão para qualquer paciente.", "NDA"],correta:4},
  {materia:"Cinesiologia e Biomecânica",tema:"Biomecânica Muscular",tipo:"Verdadeiro/Falso",dificuldade:"Médio",enunciado:"Assinale com V quando verdadeiro e F quando falso (esportes):\n\n( ) No futebol, a fase final do chute existe contração excêntrica dos isquiotibiais.\n( ) No boxe, a ação do serrátil anterior aumenta a potência do soco.\n( ) No tênis, os músculos extensores e flexores do punho são solicitados em diferentes gestos esportivos.\n( ) Ao saltar do chão para uma caixa elevada no crossfit (box jump) o atleta precisa de grande potência dos isquiotibiais.\n( ) Na aterrissagem de um salto durante a ginástica precisa-se de contração excêntrica do quadríceps para frear o movimento.\n( ) Na pernada do nado crawl utiliza-se o glúteo médio para aumento de velocidade.\n( ) Os músculos oblíquos abdominais auxiliam no aumento da potência do ataque no volei.",gabarito:"V, V, V, F, V, F, V"},
  {materia:"Cinesiologia e Biomecânica",tema:"Tornozelo e Pé",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Paciente chega em seu consultório após trauma em tornozelo direito com eversão forçada. Assinale a alternativa que apresente a estrutura com maior probabilidade de ter sido lesionada.",alternativas:["Fratura do maléolo medial.", "Fratura do maléolo lateral.", "Ruptura do ligamento talofibular anterior.", "Ruptura do ligamento deltóide.", "Lesão da sindesmose."],correta:3},
  {materia:"Cinesiologia e Biomecânica",tema:"Tornozelo e Pé",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Após trauma em tornozelo com eversão forçada, qual músculo deve ser fortalecido para evitar que novas lesões deste tipo ocorram?",alternativas:["Tibial anterior.", "Tibial posterior.", "Fibular longo.", "Gastrocnêmio.", "Extensor longo do hálux."],correta:1},
  {materia:"Cinesiologia e Biomecânica",tema:"Joelho",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Em um paciente que foi submetido a cirurgia de retirada da patela, qual das fases da marcha deverá ser mais afetada?",alternativas:["Resposta à carga.", "Balanço médio.", "Balanço final.", "Apoio médio.", "Contato inicial."],correta:0},
  {materia:"Cinesiologia e Biomecânica",tema:"Quadril",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"A posição de flexão do quadril aumenta a congruência óssea porém reduz a estabilidade articular. Assinale a alternativa que justifica essa afirmação:",alternativas:["Em flexão existe relaxamento do ligamento redondo, reduzindo estabilidade.", "Em flexão existe relaxamento do ligamento iliofemural, reduzindo estabilidade.", "Em flexão os ligamentos estão tensos, aumentando a congruência óssea.", "Em flexão o labrum perde eficiência.", "A afirmação está incorreta."],correta:1},
  {materia:"Cinesiologia e Biomecânica",tema:"Biomecânica Muscular",tipo:"Verdadeiro/Falso",dificuldade:"Médio",enunciado:"Assinale com V quando verdadeiro e F quando falso (marcha):\n\n( ) Durante a marcha o contato inicial fisiológico sempre será com o retropé.\n( ) O glúteo máximo é fundamental estabilizador da pelve em apoio médio.\n( ) No balanço o talus encontra-se fora da pinça bimaleolar.\n( ) Em apoio médio há bloqueio do joelho resultado, principalmente, da ação isométrica do quadríceps.\n( ) A não abertura da pinça bimaleolar pode prejudicar o balanço médio.",gabarito:"V, F, V, F, V"},
  {materia:"Cinesiologia e Biomecânica",tema:"Biomecânica Muscular",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Durante a marcha, diversas estratégias são adotadas pelo corpo com objetivo de minimizar o gasto energético. Sobre essas estratégias assinale a alternativa correta.",alternativas:["Quanto maior a largura do passo, menos será o balanço lateral do tronco.", "Quanto mais a queda da pelve no apoio médio, menor será o gasto energético da marcha.", "A flexão do joelho na resposta a carga evita aumento da oscilação vertical do centro de gravidade.", "Os movimentos das cinturas pélvica e escapular devem ser simétricos combinados.", "Os movimentos combinados de flexão plantar/extensão do joelho e dorsoflexão/flexão do joelho ajudam a reduzir a oscilação vertical do centro de gravidade."],correta:4},
  {materia:"Cinesiologia e Biomecânica",tema:"Biomecânica Muscular",tipo:"Dissertativa",dificuldade:"Médio",enunciado:"Explique a importância da fase de pré-balanço para o comprimento do passo."},
  {materia:"Cinesiologia e Biomecânica",tema:"Joelho",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"A patela é uma das estruturas mais lesionadas do joelho. Uma das lesões mais comuns é a sua luxação lateral em relação ao fêmur. Baseado nisso, assinale a alternativa que apresenta alteração biomecânica que pode piorar essa lesão.",alternativas:["Valgo do joelho.", "Rotação externa do quadril.", "Pé cavo.", "Pronação da tíbia.", "Extensão do joelho."],correta:0},
  {materia:"Cinesiologia e Biomecânica",tema:"Quadril",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Baseado nos posicionamentos que pioram a luxação lateral da patela, qual músculo deve ser fortalecido neste paciente?",alternativas:["Glúteo máximo.", "Gastrocnêmio.", "Isquiotibiais.", "Glúteo mínimo.", "Poplíteo."],correta:3},
  {materia:"Cinesiologia e Biomecânica",tema:"Punho e Mão",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Paciente sofreu um trauma direto na borda ulnar da mão esquerda, gerando desvio radial abrupto. Baseado neste achado, qual lesão apresenta maior probabilidade de ocorrer?",alternativas:["Fratura do processo estilóide da ulna.", "Fratura do processo estilóide do rádio.", "Lesão do ligamento colateral lateral do punho.", "Lesão do ligamento colateral medial do punho.", "Lesão do ligamento transverso do carpo."],correta:3},
  {materia:"Cinesiologia e Biomecânica",tema:"Quadril",tipo:"Dissertativa",dificuldade:"Médio",enunciado:"Qual relação pode haver entre glúteo máximo e pé plano?"},
  {materia:"Cinesiologia e Biomecânica",tema:"Cotovelo",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Paciente chega em seu consultório após trauma em membro superior direito com importante redução do movimento de prono-supinação do antebraço (cotovelo). Baseado nisso, qual as possíveis estruturas lesionadas?",alternativas:["Olécrano e tróclea.", "Membrana interóssea e ligamento anular.", "Ligamento colateral lateral e medial.", "Capítulo e incisura troclear.", "Epicôndilo medial e cabeça do rádio."],correta:1},
  {materia:"Cinesiologia e Biomecânica",tema:"Ombro",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"O movimento de abdução do ombro é o mais importante, e complexo, dessa articulação. Sobre este movimento responda:",alternativas:["Durante o início da abdução, o movimento depende exclusivamente do supra-espinhoso.", "O serrátil anterior é de fundamental importância para a abdução fisiológica do ombro.", "O manguito rotador tem vetor de força inferior, impedindo a elevação da cabeça do úmero.", "A contração do trapézio superior durante a abdução indica falha do padrão de movimento.", "A falta da mobilidade escapular durante as três etapas da abdução indicam disfunção articular."],correta:1},
  {materia:"Cinesiologia e Biomecânica",tema:"Coluna",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Paciente chega ao serviço com queixa de dor torácica importante e limitação do movimento da coluna e do ombro. Durante avaliação você observa significativa hipercifose torácica. Baseado nestes achados assinale a alternativa correta.",alternativas:["Este posicionamento vertebral aumenta a pressão anterior do disco vertebral, aumentando compressão no ligamento longitudinal anterior.", "A hipercifose aumenta a pressão nas facetas articulares.", "A hipercifose é uma curva fisiológica da coluna.", "O deslocamento posterior do núcleo pulposo na hipercifose pode favorecer compressão da medula.", "A compressão dos discos vertebrais é, necessariamente, causadora de dor."],correta:3},
  {materia:"Cinesiologia e Biomecânica",tema:"Ombro",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Qual correlação pode haver entre a hipercifose torácica e a limitação do movimento do ombro?",alternativas:["A hipercifose favorece a abdução da escápula e, consequentemente rotação interna do úmero. Isso aumenta a pressão subacromial.", "A hipercifose gera aumento da mobilidade torácica, reduzindo consequentemente a mobilidade do ombro.", "A hipercifose gera adução escapular e aumento da pressão subacromial.", "A hipercifose aumenta o torque do trapézio superior aumentando a elevação da escápula.", "A hipercifose não apresenta correlação com queixas de ombro."],correta:0},
  {materia:"Cinesiologia e Biomecânica",tema:"Coluna",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Sobre os elementos estabilizadores da articulação da coluna, assinale a alternativa:",alternativas:["Os músculos da coluna podem controlar os movimentos vertebrais, reduzindo o estresse dos discos vertebrais.", "A lesão do disco vertebral resulta inevitavelmente em instabilidade.", "Por não possuir músculos importantes, a estabilidade da coluna é unicamente passiva.", "Ligamentos, cápsula e discos são elementos sinoviais de estabilidade da coluna.", "A estabilidade passiva da coluna é reduzida na lombar por conta da alta mobilidade comparada aos demais segmentos."],correta:0},
  {materia:"Cinesiologia e Biomecânica",tema:"Ombro",tipo:"Dissertativa",dificuldade:"Difícil",enunciado:"O manguito rotador reduz a ação lesiva do deltoide durante a abdução. Justifique essa afirmação."},
  {materia:"Cinesiologia e Biomecânica",tema:"Joelho",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Paciente chega em seu consultório após trauma em região lateral da perna com importante deslocamento medial do joelho, resultando em um valgo forçado. Baseado no mecanismo do trauma, qual estrutura pode ter sido lesionada?",alternativas:["Ligamento patelar.", "Ligamento cruzado posterior.", "Ligamento colateral lateral.", "Ligamento colateral medial.", "Patela."],correta:3},
  {materia:"Cinesiologia e Biomecânica",tema:"Tornozelo e Pé",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Após valgo forçado do joelho resultando em geno valgo, qual desalinhamento plantar é mais provável de acontecer?",alternativas:["Abaixamento do arco longitudinal medial (pé plano).", "Abaixamento do arco longitudinal lateral.", "Abaixamento do arco transverso anterior.", "Elevação do arco longitudinal medial.", "A presente alteração não gera desalinhamento nos pés."],correta:0},
  {materia:"Cinesiologia e Biomecânica",tema:"ATM",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"O deslocamento anterior do disco da ATM ocorre de forma ativa, já seu deslocamento posterior ocorre de forma passiva. Analise essa afirmativa e assinale a alternativa correta:",alternativas:["A frase está incorreta, já que todo deslocamento do disco é ativo.", "A frase está incorreta, já que todo deslocamento do disco é passivo.", "A frase é incorreta, já que o deslocamento anterior é passivo e o posterior é ativo.", "A frase está correta, já que o disco é tracionado anteriormente pelo pterigóide lateral.", "A frase está correta, já que o disco é tracionado anteriormente pelo pterigóide medial."],correta:3},
  {materia:"Cinesiologia e Biomecânica",tema:"Biomecânica Muscular",tipo:"Verdadeiro/Falso",dificuldade:"Médio",enunciado:"Durante a marcha mantemos um ciclo de aceleração e freio do nosso centro de gravidade. Observe as fases da marcha abaixo e indique se estão relacionadas a aceleração (A), freio (F) ou velocidade neutra (N):\n\n( ) Contato inicial.\n( ) Balanço inicial.\n( ) Balanço final.\n( ) Resposta a carga.\n( ) Apoio médio.",gabarito:"F, A, F, F, N"},
  {materia:"Cinesiologia e Biomecânica",tema:"Tornozelo e Pé",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Sobre a estabilidade dinâmica da inversão do tornozelo assinale a alternativa correta:",alternativas:["Depende especialmente do maléolo lateral.", "Depende especialmente do ligamento talofibular anterior.", "Depende especialmente do músculo tibial posterior.", "Depende especialmente do músculo fibular.", "Depende especialmente do tríceps sural."],correta:3},
  {materia:"Cinesiologia e Biomecânica",tema:"Joelho",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Um paciente que sofre uma fratura grave da patela precisa retirar completamente essa estrutura óssea. Durante a recuperação, qual principal dificuldade será observada por este paciente?",alternativas:["Redução da capacidade do quadríceps em gerar movimento.", "Redução da capacidade dos isquiotibiais em gerar movimento.", "Tendência a valgo dos joelhos.", "Tendência a varo dos joelhos.", "Não haverá dificuldades por parte do paciente."],correta:0},
  {materia:"Cinesiologia e Biomecânica",tema:"Ombro",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Sobre as características do movimento de flexão do ombro, assinale a alternativa correta.",alternativas:["Nos graus iniciais de ADM ocorre exclusivamente na articulação glenoumeral.", "Os últimos graus de ADM dependem principalmente do movimento escapular.", "O trapézio inferior atua sobre a escápula entre 0 e 60 graus.", "Depende de uma rotação interna para ocorrer em sua plenitude.", "NDA"],correta:1},
  {materia:"Cinesiologia e Biomecânica",tema:"Tornozelo e Pé",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"São fatores que limitam a ADM de dorsoflexão do tornozelo, exceto:",alternativas:["Encurtamento do tríceps sural.", "Rigidez tibiofibular.", "Rigidez de tálus.", "Encurtamento do tibial anterior.", "NDA"],correta:3},
  {materia:"Cinesiologia e Biomecânica",tema:"Biomecânica Muscular",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Sobre as determinantes da marcha, assinale a alternativa incorreta.",alternativas:["Servem principalmente para otimizar a eficiência energética da marcha.", "O membro que avança na marcha é acompanhado do quadril homolateral que avança, reduzindo a necessidade de flexão.", "Ocorre uma inclinação lateral do tronco, contralateral ao membro de apoio.", "O movimento do joelho deve ser coordenado com o movimento do tornozelo.", "NDA"],correta:1},
  {materia:"Cinesiologia e Biomecânica",tema:"Coluna",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Assinale a alternativa que explica o que ocorre na coluna durante uma extensão da lombar.",alternativas:["Compressão posterior do disco e deslocamento anterior do núcleo pulposo.", "Compressão anterior do disco e deslocamento anterior do núcleo pulposo.", "Compressão posterior do disco e deslocamento posterior do núcleo pulposo.", "Compressão anterior do disco e deslocamento posterior do núcleo pulposo.", "NDA"],correta:0},
  {materia:"Cinesiologia e Biomecânica",tema:"Coluna",tipo:"Múltipla Escolha",dificuldade:"Médio",enunciado:"Lesões de coluna torácica são pouco comuns, quando comparadas à cervical e à lombar. Assinale a alternativa que justifica essa afirmativa.",alternativas:["A coluna torácica é mais móvel por conta do seu formato.", "A coluna torácica é menos móvel por conta da articulação com as costelas.", "Pelo maior número de vértebras torácicas.", "Por estar entre dois segmentos vertebrais.", "NDA"],correta:1},

function log(msg,tipo='ok'){
  const d=document.getElementById('log');
  d.innerHTML+=`<div class="${tipo}">${msg}</div>`;
  d.scrollTop=d.scrollHeight;
}

function setProgress(n,total){
  document.getElementById('prog').style.width=(n/total*100)+'%';
}

async function importar(){
  const btn=document.getElementById('btn');
  btn.disabled=true;
  log('Iniciando importação de '+questoes.length+' questões...','info');

  try{
    // Salvar tags
    await db.collection('bancoquestoes_config').doc('tags').set(tags);
    log('✅ Tags atualizadas (+ Ombro, Amputados)','ok');

    // Inserir questões
    for(let i=0;i<questoes.length;i++){
      const q={...questoes[i],createdAt:firebase.firestore.FieldValue.serverTimestamp()};
      await db.collection('bancoquestoes_questoes').add(q);
      setProgress(i+1,questoes.length);
      log(`✅ [${i+1}/${questoes.length}] ${q.tema} — ${q.enunciado.substring(0,55)}...`,'ok');
    }

    log('\n🎉 Concluído! '+questoes.length+' questões importadas com sucesso.','info');
    log('Acesse o app Minhas Questões para verificar.','info');
  }catch(e){
    log('❌ Erro: '+e.message,'err');
    btn.disabled=false;
  }
}
</script>
